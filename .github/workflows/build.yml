name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # 手动触发：不改代码重跑整条流水线（发布产物核验等）无需空提交
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 所有 action 按 commit SHA 固定（tag 可被仓库侧改写重指；行尾注释记录版本）。
# 升级由 Dependabot 提 PR 更新 SHA 与注释，人工审查 diff 后合入
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 完整克隆：git describe 需要可达 tag，浅克隆取不到
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # spotlessCheck 与 apiCheck（公开 API 二进制兼容校验）挂在 check 上，
      # build 已含两者；iOS 目标在 Linux 交叉编译，jvm/android 单元测试与
      # wasm(Node) 测试在本机执行
      - name: Build, test and check format
        run: ./gradlew build

      # Maven Central 发布本身只在 Release 工作流（tag 推送、带凭据）执行；发布链路
      # 的 CI 覆盖在这里：发布到本地 Maven 后断言三模块 KMP 十八构件（各 root+5 平台：
      # 核心、serialization、rrule）齐全、pom 传递依赖正确（核心含 tyme4kt 与
      # kotlinx-datetime，serialization 含 nexttime 与 kotlinx-serialization-core，
      # rrule 含 nexttime）。版本是当前 HEAD 推导出的任意值——普通 main 推送
      # 按设计就是 0.0.0-SNAPSHOT（HEAD 在 tag 之后，已发布号子永不沾染未发布提交），
      # tag 版本只在 main HEAD 本身被打了 tag 时出现；精确 tag 推导的端到端守护在
      # Release 工作流（检出 tag）里
      - name: Verify Maven publishing
        run: |
          ./gradlew publishToMavenLocal
          GROUP_DIR="$HOME/.m2/repository/io/github/kamiiroawase"
          ROOT="$GROUP_DIR/nexttime"
          test "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          VERSION=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          test -n "$VERSION"
          for module in nexttime nexttime-serialization nexttime-rrule; do
            M="$GROUP_DIR/$module/$VERSION"
            test -f "$M/$module-$VERSION.module" || { echo "missing artifact: $M/$module-$VERSION.module"; exit 1; }
            test -f "$M/$module-$VERSION.jar" || { echo "missing artifact: $M/$module-$VERSION.jar"; exit 1; }
            test -f "$M/$module-$VERSION.pom" || { echo "missing artifact: $M/$module-$VERSION.pom"; exit 1; }
          done
          for module in nexttime nexttime-serialization nexttime-rrule; do
            for art in \
              "$GROUP_DIR/$module-android/$VERSION/$module-android-$VERSION.aar" \
              "$GROUP_DIR/$module-jvm/$VERSION/$module-jvm-$VERSION.jar" \
              "$GROUP_DIR/$module-iosarm64/$VERSION/$module-iosarm64-$VERSION.klib" \
              "$GROUP_DIR/$module-iossimulatorarm64/$VERSION/$module-iossimulatorarm64-$VERSION.klib" \
              "$GROUP_DIR/$module-wasm-js/$VERSION/$module-wasm-js-$VERSION.klib"; do
              test -f "$art" || { echo "missing artifact: $art"; exit 1; }
            done
          done
          A="$GROUP_DIR/nexttime/$VERSION"
          grep -q cn.6tail "$A/nexttime-$VERSION.pom"
          grep -q kotlinx-datetime "$A/nexttime-$VERSION.pom"
          grep -q "nexttime" "$GROUP_DIR/nexttime-serialization/$VERSION/nexttime-serialization-$VERSION.pom"
          grep -q kotlinx-serialization-core "$GROUP_DIR/nexttime-serialization/$VERSION/nexttime-serialization-$VERSION.pom"
          grep -q "nexttime" "$GROUP_DIR/nexttime-rrule/$VERSION/nexttime-rrule-$VERSION.pom"
          echo "Published artifacts verified: $VERSION"

      # KDoc 生成的 API 参考文档，精心维护的文档无需本地跑 Dokka 即可浏览；
      # 以工作流产物上传（后续如有值得接的文档部署，可再挂 Pages）——根模块与
      # 两个可选模块（serialization/rrule）一并生成
      - name: Generate API documentation
        run: ./gradlew dokkaGeneratePublicationHtml :serialization:dokkaGeneratePublicationHtml :rrule:dokkaGeneratePublicationHtml

      - name: Upload API documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: |
            build/dokka/html/**
            serialization/build/dokka/html/**
            rrule/build/dokka/html/**

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
            serialization/build/reports/tests/**
            serialization/build/test-results/**
            rrule/build/reports/tests/**
            rrule/build/test-results/**
          if-no-files-found: ignore

  # iOS 模拟器测试需要 macOS；ubuntu job 已覆盖编译交叉验证
  ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
            serialization/build/reports/tests/**
            serialization/build/test-results/**
            rrule/build/reports/tests/**
            rrule/build/test-results/**
          if-no-files-found: ignore

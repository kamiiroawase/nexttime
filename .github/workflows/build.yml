name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 完整克隆：git describe 需要可达 tag，浅克隆取不到
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # spotlessCheck 挂在 check 上，build 已含格式检查；
      # iOS 目标在 Linux 交叉编译，jvm/android 单元测试与 wasm(Node) 测试在本机执行
      - name: Build, test and check format
        run: chmod +x gradlew && ./gradlew build

      # Maven Central 发布本身只在 Release 工作流（tag 推送、带凭据）执行；发布链路
      # 的 CI 覆盖在这里：发布到本地 Maven 后断言 KMP 六模块（根 +
      # android/jvm/iosArm64/iosSimulatorArm64/wasmJs）产物齐全、pom 中含 tyme4kt 与
      # kotlinx-datetime 传递依赖。版本是当前 HEAD 推导出的任意值——普通 main 推送
      # 按设计就是 0.0.0-SNAPSHOT（HEAD 在 tag 之后，已发布号子永不沾染未发布提交），
      # tag 版本只在 main HEAD 本身被打了 tag 时出现；精确 tag 推导的端到端守护在
      # Release 工作流（检出 tag）里
      - name: Verify Maven publishing
        run: |
          ./gradlew publishToMavenLocal
          GROUP_DIR="$HOME/.m2/repository/io/github/kamiiroawase"
          ROOT="$GROUP_DIR/nexttime"
          test "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          VERSION=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          test -n "$VERSION"
          A="$ROOT/$VERSION"
          for art in \
            "$A/nexttime-$VERSION.module" \
            "$A/nexttime-$VERSION.jar" \
            "$GROUP_DIR/nexttime-android/$VERSION/nexttime-android-$VERSION.aar" \
            "$GROUP_DIR/nexttime-jvm/$VERSION/nexttime-jvm-$VERSION.jar" \
            "$GROUP_DIR/nexttime-iosarm64/$VERSION/nexttime-iosarm64-$VERSION.klib" \
            "$GROUP_DIR/nexttime-iossimulatorarm64/$VERSION/nexttime-iossimulatorarm64-$VERSION.klib" \
            "$GROUP_DIR/nexttime-wasm-js/$VERSION/nexttime-wasm-js-$VERSION.klib"; do
            test -f "$art" || { echo "missing artifact: $art"; exit 1; }
          done
          grep -q cn.6tail "$A/nexttime-$VERSION.pom"
          grep -q kotlinx-datetime "$A/nexttime-$VERSION.pom"
          echo "Published artifacts verified: $VERSION"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  # iOS 模拟器测试需要 macOS；ubuntu job 已覆盖编译交叉验证
  ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      - name: Run iOS simulator tests
        run: chmod +x gradlew && ./gradlew iosSimulatorArm64Test

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

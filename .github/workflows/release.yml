# v* tag 推送时触发：把 KMP 模块构件签名发布到 Maven Central（Central Portal、
# 自动 release），并重新发布到本地 Maven 仓库作为 GitHub Release 附件（aar/jar/klib
# 加 pom/module/sources，Release 不存在则自动创建）；tag 带的 README 版本坐标没随
# tag 更新时大声失败。完整构建门禁（编译、主机侧测试、格式检查）在发布之前于
# tag 本身运行——tag 可能指向未经 Build 工作流验证的提交，而 Central 发布不可撤销。
#
# 所需仓库 secrets（Central Portal：https://central.sonatype.com）：
#   ORG_GRADLE_PROJECT_mavenCentralUsername / …Password — Portal 用户令牌
#   ORG_GRADLE_PROJECT_signingInMemoryKey — ASCII 甲胄私钥
#     （gpg --export-secret-keys --armor …）
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId — 私钥 id
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword — 私钥口令
#
# 本工作流持有 Central 发布凭据与 GPG 私钥，是供应链攻击的高价值目标：所有
# action 一律按 commit SHA 固定（tag 可被仓库侧改写重指；行尾注释记录版本），
# 升级只能通过 Dependabot 提 PR 改 SHA、人工审查 diff 后合入
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

# 与 Build 工作流同构的并发组，但绝不取消进行中的运行：发布到 Central 不可撤销，
# 中途杀掉会留下半成品状态（未完成的 Central 部署、残缺的 GitHub Release 附件）；
# 同一 tag 删除重推的极端场景下，后一次发布排队等待而非并发执行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 完整克隆：版本由 v* tag 精确推导，浅克隆取不到 tag
          fetch-depth: 0

      # README 记录着发布坐标（引入章节的版本表与示例，共多处）：忘了 bump 就会把
      # 旧版本号发给每一位读者，直到有人注意到。改为让发布失败：tag 版本必须在
      # README 中出现。匹配用 token 锚定——固定字符串 grep 会命中子串
      # （1.1.0 命中 11.1.0 或 1.1.0.1）。不做「上一版本必须消失」的反向断言：
      # 版本历史一节按设计保留全部旧版本号，只有正向出现检查有区分度
      - name: Check README version coordinates match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          mentions_version() {
            grep -Eq "(^|[^0-9.])${1//./\\.}([^0-9.]|$)" "$2"
          }
          mentions_version "$VERSION" README.md || {
            echo "README.md does not mention version $VERSION — bump the documented coordinates"
            exit 1
          }

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # 与 Build 工作流在 main 上跑的同一道门禁：tag 可能指向从未经过 CI 的提交
      # （比如从特性分支直接打 tag），而发布到 Central 不可撤销——发布前先验证
      - name: Build and test
        run: ./gradlew build

      - name: Publish to local Maven
        run: ./gradlew publishToMavenLocal

      # tag 检出恰好落在 v* tag 上，精确匹配推导必须产出恰为 tag 的版本——此处
      # 出现 SNAPSHOT 意味着发布资产挂错坐标、所有文档化查询全部失效
      - name: Verify published version equals the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -d "$HOME/.m2/repository/io/github/kamiiroawase/nexttime/$VERSION" || {
            echo "expected published version $VERSION (exact-match tag derivation), found instead:"
            ls "$HOME/.m2/repository/io/github/kamiiroawase/nexttime"
            exit 1
          }

      # 真正的分发：构件签名上传 Central Portal 并自动发布。--no-configuration-cache
      # 让发布任务避开任何第三方插件对配置缓存的边缘问题；发布不该败在这些上面
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      - name: Collect release assets
        run: |
          M2="$HOME/.m2/repository/io/github/kamiiroawase"
          STAGE="release-assets"
          mkdir -p "$STAGE"
          for module in \
            nexttime \
            nexttime-android \
            nexttime-jvm \
            nexttime-iosarm64 \
            nexttime-iossimulatorarm64 \
            nexttime-wasm-js; do
            find "$M2/$module" -type f ! -name 'maven-metadata-local.xml' -exec cp {} "$STAGE/" \;
          done
          echo "Collected $(find "$STAGE" -type f | wc -l) files"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true

# 依赖自动更新：gradle（版本目录里的库与插件、构建脚本插件）与 GitHub Actions
# 各一组，每周一组汇总为一个 PR，减少碎片评审。Actions 已按 commit SHA 固定，
# Dependabot 会更新 SHA 并同步行尾的版本注释；发布链路的 action 升级务必 diff
# 审查（见 release.yml 顶部说明）
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  # gradle 只覆盖版本目录与构建脚本；gradle-version 让 wrapper 的
  # distributionUrl 跟进新的 Gradle 发行版
  - package-ecosystem: gradle-version
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle-version:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
